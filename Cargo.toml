[workspace]
resolver = "3"
members = ["crates/*", "desktop/src-tauri"]
default-members = ["crates/orither-link", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
argon2 = "0.5"
blake3 = "1"
iroh = { version = "1.4", features = ["unstable-custom-transports"] }
iroh-base = "1.4"
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
n0-watcher = "1"
noq-udp = { version = "1.4", default-features = false }
orither-link = { path = "crates/orither-link" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true
